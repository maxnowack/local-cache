name: 'Save a cache'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  key:
    description: 'An explicit key for saving the cache'
    required: true
  compression-mode:
    description: 'Compression mode to use for cache archives. Supported values are auto, gzip, zstd, and lz4.'
    default: 'auto'
    required: false
  compression-args:
    description: 'Additional arguments to pass to the compression program when saving a cache archive.'
    required: false
runs:
  using: 'node20'
  main: '../dist/saveOnly.js'
branding:
  icon: 'archive'
  color: 'gray-dark'
